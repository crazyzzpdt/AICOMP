[project]
name = "yolo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "calflops>=0.3.2",
    "faster-coco-eval>=1.8.0",
    "loguru>=0.7.3",
    "pypandoc-binary>=1.17",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "tensorboard>=2.21.0",
    "torch==2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "typst>=0.15.0",
    "ultralytics>=8.4.152",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
